<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Sketchbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,750&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4e9ec; --panel:#f5f7f8; --ink:#1d2830; --muted:#5d6b75; --line:#cbd3d8;
  --accent:#b4561a; --accent-ink:#ffffff; --stage1:#f2f5f7; --stage2:#c9d3d9; --field:#e9eef1;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131a1f; --panel:#1b242b; --ink:#e3e9ed; --muted:#92a0aa; --line:#2e3a44;
    --accent:#ee8d3e; --accent-ink:#1b1006; --stage1:#26323b; --stage2:#0f1519; --field:#232e36;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131a1f; --panel:#1b242b; --ink:#e3e9ed; --muted:#92a0aa; --line:#2e3a44;
  --accent:#ee8d3e; --accent-ink:#1b1006; --stage1:#26323b; --stage2:#0f1519; --field:#232e36;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; overflow:hidden; font-size:15px; line-height:1.4;
}
header{display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel)}
h1{font-size:19px; font-weight:750; letter-spacing:-0.01em; margin:0; white-space:nowrap}
.presets{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; flex:1}
.presets::-webkit-scrollbar{display:none}
button{font:inherit; color:inherit; cursor:pointer}
.chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:5px 12px; white-space:nowrap; font-size:14px}
.chip:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,label.file:focus-within{outline:2px solid var(--accent); outline-offset:2px}
main{flex:1; display:flex; flex-direction:column; min-height:0}
#stage{position:relative; flex:1 1 50%; min-height:220px; background:radial-gradient(ellipse at 50% 35%, var(--stage1), var(--stage2)); overflow:hidden; touch-action:none}
#stage canvas{display:block; width:100%; height:100%; position:relative; z-index:1}
#behind{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; z-index:0; display:none}
.stage-tools{position:absolute; right:10px; bottom:10px; display:flex; gap:6px; z-index:2}
.stage-tools button{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:13px}
.stage-tools button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
#panel{flex:1 1 50%; min-height:0; display:flex; flex-direction:column; background:var(--panel); border-top:1px solid var(--line)}
.tabs{display:flex; border-bottom:1px solid var(--line)}
.tabs button{flex:1; background:none; border:0; padding:10px 0; font-weight:600; color:var(--muted); border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
#content{overflow-y:auto; padding:12px 14px 24px; flex:1}
.row{margin:12px 0}
.row label.lbl{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px}
.row output{color:var(--muted); font-variant-numeric:tabular-nums}
input[type=range]{width:100%; accent-color:var(--accent)}
.seg{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{flex:1; border:0; background:transparent; padding:7px 4px; font-size:14px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600}
.seg-label{font-size:14px; margin-bottom:4px; display:block}
.pe{position:relative; height:270px; background:var(--field); border-radius:10px; overflow:hidden}
.pe canvas{width:100%; height:100%; display:block; touch-action:none}
.hint{font-size:13px; color:var(--muted); margin:6px 0 0}
.section{margin-top:18px; padding-top:12px; border-top:1px solid var(--line)}
.section h2{font-size:15px; margin:0 0 6px; font-weight:650}
.swatches{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.sw{border:1px solid var(--line); background:transparent; border-radius:10px; padding:8px 4px 6px; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px}
.sw i{width:26px; height:26px; border-radius:50%; display:block; border:1px solid rgba(127,127,127,.35)}
.sw[aria-pressed="true"]{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
label.file{display:inline-block; border:1px solid var(--accent); color:var(--accent); border-radius:9px; padding:7px 14px; cursor:pointer; font-weight:600}
label.file input{position:absolute; opacity:0; width:1px; height:1px}
.check{display:flex; gap:8px; align-items:center; font-size:14px; margin-top:10px}
.linkbtn{background:none; border:0; color:var(--muted); text-decoration:underline; padding:0; margin-left:12px; font-size:14px}
@media (min-width:900px){
  main{flex-direction:row}
  #stage{flex:1 1 auto}
  #panel{flex:0 0 400px; border-top:0; border-left:1px solid var(--line)}
  .pe{height:330px}
}
dialog{border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink); padding:0; width:min(780px,calc(100vw - 32px)); max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,15,20,.45)}
.dlg{padding:16px 18px}
.dlg h2{margin:0 0 2px; font-size:17px; font-weight:700}
.dlg .opts{display:grid; grid-template-columns:1fr 1fr; gap:0 16px}
.dlg .opts .wide{grid-column:1/-1}
.dlg img{width:100%; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:8px; display:block; min-height:80px}
.dlg-actions{display:flex; justify-content:flex-end; align-items:center; gap:14px; margin-top:12px}
.primary{background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:8px 16px; font-weight:600}
.num input{width:100%; font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--field); color:var(--ink)}
@media (max-width:560px){ .dlg .opts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Glass Sketchbook</h1>
  <div class="presets" aria-label="Start from">
    <button class="chip" data-preset="onion">Onion</button>
    <button class="chip" data-preset="flask">Flask with spouts</button>
    <button class="chip" data-preset="donut">Spiked donut</button>
    <button class="chip" data-preset="tank">Squared tank</button>
    <button class="chip" data-preset="jaw">Sphere on a jaw</button>
  </div>
</header>
<main>
  <div id="stage">
    <img id="behind" alt="">
    <div class="stage-tools">
      <button id="drawBtn">Drawing</button>
      <button id="spinBtn" aria-pressed="false">Spin</button>
      <button id="viewBtn">Reset view</button>
    </div>
  </div>
  <section id="panel">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="shape" aria-selected="true">Shape</button>
      <button role="tab" data-tab="bits" aria-selected="false">Bits</button>
      <button role="tab" data-tab="color" aria-selected="false">Color</button>
    </div>
    <div id="content"></div>
  </section>
</main>
<dialog id="drawDlg" aria-labelledby="drawTitle">
  <form method="dialog" class="dlg">
    <h2 id="drawTitle">Orthographic drawing</h2>
    <p class="hint" style="margin:0">Front, side and top views at one true scale, with no perspective, so you can measure straight off the sheet.</p>
    <div class="opts" id="drawOpts"></div>
    <img id="drawPrev" alt="Preview of the drawing sheet">
    <div class="dlg-actions">
      <button class="linkbtn" value="close">Close</button>
      <button type="button" class="primary" id="drawSave">Save PNG</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLORS = {
  clear:{n:'Clear',hex:'#dcecf1',op:.3}, cobalt:{n:'Cobalt',hex:'#1f45b8',op:.62},
  amber:{n:'Amber',hex:'#c8761a',op:.55}, sea:{n:'Sea green',hex:'#3fa38a',op:.5},
  ruby:{n:'Ruby',hex:'#b0173a',op:.62}, smoke:{n:'Smoke',hex:'#4a4f55',op:.6},
  opal:{n:'Opal white',hex:'#f1efe8',op:.93}, black:{n:'Black',hex:'#161616',op:.97}
};
const DEFAULT = {
  body:'bubble',
  profile:[[0,0],[.6,.02],[.92,.3],[.88,.72],[.5,1.08],[.16,1.32],[.04,1.55]],
  flatten:1, square:0,
  donut:{R:.62,tube:.42,tall:1.08,flatten:.32,neckH:.55,neckW:.42},
  bits:{count:0,mode:'ring',shape:'spike',at:.8,from:.3,to:.7,len:.5,size:.12,curl:0},
  color:'clear', wraps:0, wrapColor:'opal',
  open:{cut:0,tilt:0,turn:0,lip:'fire'},
  jaw:{on:false,at:.18,around:180,len:.45,size:.17,square:0,hollow:false},
  draw:{style:'both',height:20,unit:'cm'}
};
const PRESETS = {
  onion:{profile:[[0,0],[.6,.02],[.92,.3],[.88,.72],[.5,1.08],[.16,1.32],[.04,1.55]],
    bits:{count:2,mode:'ring',shape:'horn',at:.8,len:.6,size:.13,curl:.75}, color:'amber', wraps:7, wrapColor:'opal'},
  flask:{profile:[[0,0],[.95,0],[.92,.38],[.62,.78],[.3,.95],[.26,1.15],[.26,1.9],[.3,1.96]],
    bits:{count:1,mode:'outline',shape:'tube',from:.28,to:.28,len:.55,size:.14,curl:.15}, color:'clear'},
  donut:{body:'donut', bits:{count:10,mode:'outline',shape:'spike',len:.6,size:.2,curl:0}, color:'clear'},
  tank:{profile:[[0,0],[.85,0],[.95,.08],[.95,1.15],[.93,1.2]], flatten:.62, square:1, color:'clear', open:{cut:0,tilt:0,turn:0,lip:'ground'}},
  jaw:{profile:[[0,0],[.45,.12],[.78,.45],[.9,.9],[.78,1.35],[.45,1.68],[0,1.8]], color:'cobalt',
    open:{cut:.08,tilt:90,turn:180,lip:'fire'}, jaw:{on:true,at:.15,around:180,len:.4,size:.26,square:.85,hollow:true}}
};
function clone(o){return JSON.parse(JSON.stringify(o))}
function fromPreset(name){
  const p = PRESETS[name], s = clone(DEFAULT);
  for (const k in p){
    if (k==='bits'||k==='donut') Object.assign(s[k], clone(p[k])); else s[k]=clone(p[k]);
  }
  return s;
}
let S;
try{ const saved = localStorage.getItem('glass-sketchbook-v1'); S = saved ? Object.assign(clone(DEFAULT), JSON.parse(saved)) : fromPreset('onion'); }
catch(e){ S = fromPreset('onion'); }
let saveT;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem('glass-sketchbook-v1', JSON.stringify(S))}catch(e){} },300); }

/* ---------- 3D scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35,1,0.05,100);
scene.add(new THREE.HemisphereLight(0xffffff,0x3c4a55,0.85));
const key = new THREE.DirectionalLight(0xffffff,1.15); key.position.set(3,5,4); scene.add(key);
const rim = new THREE.DirectionalLight(0xdfefff,0.9); rim.position.set(-4,2,-5); scene.add(rim);
const warm = new THREE.PointLight(0xffb070,0.6,20); warm.position.set(-3,-1,3); scene.add(warm);

const piece = new THREE.Group(); scene.add(piece);
const shadowTex = (()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(0,0,0,.32)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c);})();
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false}));
shadow.rotation.x = -Math.PI/2; scene.add(shadow);

let yaw=0.5, pitch=0.25, dist=6, fitDist=6;
function placeCamera(){
  camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw), dist*Math.sin(pitch), dist*Math.cos(pitch)*Math.cos(yaw));
  camera.lookAt(0,0,0);
}
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* geometry helpers */
function T(x,z){
  const r=Math.hypot(x,z); if(r<1e-7) return [x,z*S.flatten];
  const th=Math.atan2(z,x), c=Math.cos(th), s=Math.sin(th); let f=1;
  if(S.square>0){ const n=2+S.square*14; f=Math.pow(Math.pow(Math.abs(c),n)+Math.pow(Math.abs(s),n),-1/n); }
  return [r*f*c, r*f*s*S.flatten];
}
function tubeAxes(dir){ // the two directions across a swept tube; its square sides line up with these
  let side=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)); if(side.lengthSq()<1e-4) side.set(0,0,1); side.normalize();
  return [side, new THREE.Vector3().crossVectors(side,dir).normalize()];
}
// superellipse: how far out to push a point at angle (c,s) so the circle becomes a rounded square
const squareF=(c,s,sq)=> sq>0 ? Math.pow(Math.pow(Math.abs(c),2+sq*10)+Math.pow(Math.abs(s),2+sq*10),-1/(2+sq*10)) : 1;
// tipK: how pointed the closed end is (1 round, near 0 flat); sq: 0 round to 1 square
function sweep(base,dir,len,r0,r1,curl,open,tipK=1,sq=0){
  const [side,bend]=tubeAxes(dir);
  const segs=28, rad=sq>0?40:16, pos=[], idx=[];
  const back=r0*0.7, L=len+back;
  const start=base.clone().addScaledVector(dir,-back);
  let tip;
  for(let i=0;i<=segs;i++){
    const s=i/segs;
    const p=start.clone().addScaledVector(dir,L*s).addScaledVector(bend,curl*L*s*s);
    const t=dir.clone().multiplyScalar(L).addScaledVector(bend,2*curl*L*s).normalize();
    const n=new THREE.Vector3().crossVectors(side,t).normalize();
    const r=r0+(r1-r0)*s;
    for(let j=0;j<rad;j++){const a=j/rad*Math.PI*2, c=Math.cos(a), sn=Math.sin(a), f=squareF(c,sn,sq);
      const v=p.clone().addScaledVector(side,c*f*r).addScaledVector(n,sn*f*r); pos.push(v.x,v.y,v.z);}
    if(i===segs) tip=p.clone().addScaledVector(t,r*tipK);
  }
  for(let i=0;i<segs;i++)for(let j=0;j<rad;j++){
    const a=i*rad+j,b=i*rad+(j+1)%rad,c=a+rad,d=b+rad; idx.push(a,c,b,b,c,d);
  }
  if(!open){ const ti=pos.length/3; pos.push(tip.x,tip.y,tip.z);
    for(let j=0;j<rad;j++){const a=segs*rad+j,b=segs*rad+(j+1)%rad; idx.push(a,ti,b);} }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  g.userData.endRing=[]; for(let j=0;j<rad;j++){ const i=(segs*rad+j)*3; g.userData.endRing.push(new THREE.Vector3(pos[i],pos[i+1],pos[i+2])); }
  return g;
}
function bitRadii(){ const b=S.bits;
  if(b.shape==='spike') return [b.size,0.006,false];
  if(b.shape==='horn') return [b.size,b.size*0.12,false];
  return [b.size,b.size*0.85,true];
}
function wrapsTex(){
  const c=document.createElement('canvas'); c.width=8; c.height=512; const g=c.getContext('2d');
  g.fillStyle=COLORS[S.color].hex; g.fillRect(0,0,8,512); g.fillStyle=COLORS[S.wrapColor].hex;
  const n=S.wraps; for(let i=0;i<n;i++){ const v=0.1+0.8*(i+0.5)/n; g.fillRect(0,512*(1-v)-4,8,8); }
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; return t;
}
function makeMat(){
  const c=COLORS[S.color], useMap=S.wraps>0;
  const op = useMap ? Math.max(c.op,.55) : c.op;
  return new THREE.MeshPhysicalMaterial({
    color: useMap?0xffffff:new THREE.Color(c.hex), map: useMap?wrapsTex():null,
    transparent:true, opacity:op, roughness:0.07, metalness:0, clearcoat:1, clearcoatRoughness:0.04,
    side:THREE.DoubleSide, depthWrite: op>0.85
  });
}
function profileCurve(){
  return new THREE.CatmullRomCurve3(S.profile.map(p=>new THREE.Vector3(Math.max(0,p[0]),p[1],0)),false,'centripetal');
}
function tAtHeight(curve,h){
  const ymax=Math.max(...S.profile.map(p=>p[1])), N=300;
  for(let i=1;i<=N;i++){ if(curve.getPointAt(i/N).y>=h*ymax) return i/N; } return 1;
}

/* openings and cold-worked lips */
const WALL=0.045; // drawn wall thickness for lips
// The cut is a flat plane that can face any way: tilt it from the top (0°) round to the
// side (90°) for a side hole, and turn it to face any side of the piece. "cut" is how much
// of the piece's depth in that direction is taken off.
function cutPlane(pts){
  const O=S.open; if(!(O.cut>0.005)) return null;
  const t=O.tilt*Math.PI/180, az=(O.turn||0)*Math.PI/180;
  const n=new THREE.Vector3(Math.sin(t)*Math.cos(az),Math.cos(t),Math.sin(t)*Math.sin(az));
  let lo=Infinity, hi=-Infinity; for(const p of pts){ const d=n.dot(p); if(d<lo) lo=d; if(d>hi) hi=d; }
  return {n, d:hi-O.cut*(hi-lo)};
}
// signed distance to the cut plane: <=0 is glass you keep, >0 is cut away
const sideOf=(pl,p)=> pl ? pl.n.dot(p)-pl.d : -1;

// Clip a mesh by the plane, triangle by triangle. Triangles that straddle the plane are split
// at it, so the cut edge is exact wherever it falls: across the top, or as a hole in the side
// with glass all around it. Returns the kept mesh plus the closed rim loop(s) of the opening.
// dist(p): <=0 keep, >0 cut away (a plane, or the footprint of the jaw's channel)
function clipBy(g,dist){
  const P=g.attributes.position, U=g.attributes.uv, I=g.index.array, v=new THREE.Vector3();
  const pos=[], uvs=[], out=[], remap=new Map(), cuts=new Map(), segs=[], d=new Float32Array(P.count);
  for(let i=0;i<P.count;i++) d[i]=dist(v.fromBufferAttribute(P,i));
  const keep=i=>{ let j=remap.get(i); if(j===undefined){ j=pos.length/3; remap.set(i,j);
    pos.push(P.getX(i),P.getY(i),P.getZ(i)); uvs.push(U.getX(i),U.getY(i)); } return j; };
  const cut=(a,b)=>{ const key=a<b?a*1e6+b:b*1e6+a; let j=cuts.get(key); if(j!==undefined) return j;
    const t=d[a]/(d[a]-d[b]); j=pos.length/3; cuts.set(key,j);
    pos.push(P.getX(a)+(P.getX(b)-P.getX(a))*t, P.getY(a)+(P.getY(b)-P.getY(a))*t, P.getZ(a)+(P.getZ(b)-P.getZ(a))*t);
    uvs.push(U.getX(a)+(U.getX(b)-U.getX(a))*t, U.getY(a)+(U.getY(b)-U.getY(a))*t); return j; };
  for(let f=0;f<I.length;f+=3){
    let a=I[f],b=I[f+1],c=I[f+2]; const ka=d[a]<=0, kb=d[b]<=0, kc=d[c]<=0, n=ka+kb+kc;
    if(n===3){ out.push(keep(a),keep(b),keep(c)); continue; }
    if(n===0) continue;
    // rotate the odd vertex to the front, keeping the winding
    const odd = n===1 ? (ka?0:kb?1:2) : (!ka?0:!kb?1:2);
    if(odd===1) [a,b,c]=[b,c,a]; else if(odd===2) [a,b,c]=[c,a,b];
    const e1=cut(a,b), e2=cut(a,c);
    if(n===1) out.push(keep(a),e1,e2);
    else { const xb=keep(b), xc=keep(c); out.push(e1,xb,xc, e1,xc,e2); }
    segs.push([e1,e2]);
  }
  // chain the cut segments into closed rim loops
  const adj=new Map(), link=(x,y)=>{ if(x===y) return; if(!adj.has(x)) adj.set(x,[]); adj.get(x).push(y); };
  segs.forEach(([x,y])=>{ link(x,y); link(y,x); });
  const seen=new Set(), loops=[];
  for(const s of adj.keys()){
    if(seen.has(s)) continue;
    const loop=[]; let prev=-1, cur=s;
    while(cur!==undefined && !seen.has(cur)){ seen.add(cur); loop.push(cur);
      const nx=(adj.get(cur)||[]).find(x=>x!==prev && !seen.has(x)); prev=cur; cur=nx; }
    if(!(adj.get(loop[loop.length-1])||[]).includes(s)) continue; // not closed
    const pts=[]; for(const i of loop){ const p=new THREE.Vector3(pos[i*3],pos[i*3+1],pos[i*3+2]);
      if(!pts.length || p.distanceTo(pts[pts.length-1])>1e-4) pts.push(p); }
    if(pts.length>=12) loops.push(pts);
  }
  const g2=new THREE.BufferGeometry();
  g2.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g2.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g2.setIndex(out); g2.computeVertexNormals();
  return {geo:g2, loops};
}

// The jaw's place on the body: where it starts, which way it points, and its tube axes.
function jawFrame(curve){
  const J=S.jaw; if(!J||!J.on) return null;
  const up=new THREE.Vector3(0,1,0), t=tAtHeight(curve,J.at), pt=curve.getPointAt(t), tan=curve.getTangentAt(t), phi=J.around*Math.PI/180;
  const n2=new THREE.Vector2(tan.y,-tan.x).normalize();
  const [px,pz]=T(pt.x*Math.cos(phi),pt.x*Math.sin(phi)), base=new THREE.Vector3(px,pt.y,pz);
  const hz=new THREE.Vector3(px,0,pz); if(hz.lengthSq()<1e-6) hz.set(Math.cos(phi),0,Math.sin(phi)); hz.normalize();
  // out from the surface, then angled down toward the table
  const outward=hz.clone().multiplyScalar(n2.x).addScaledVector(up,n2.y).normalize();
  const dir=outward.multiplyScalar(Math.cos(.7)).addScaledVector(up,-Math.sin(.7)).normalize();
  const [side,bend]=tubeAxes(dir);
  return {base,dir,hz,side,bend};
}
// The second hole: the jaw's own footprint, pushed through the wall so the hollow jaw
// opens into the inside of the piece. Only near the jaw, so the far wall stays whole.
function channelDist(jf,r,sq){
  const v=new THREE.Vector3(), depth=r*3;
  return p=>{ v.copy(p).sub(jf.base); if(v.dot(jf.dir)<-depth) return -1;
    const a=v.dot(jf.side)/r, b=v.dot(jf.bend)/r, m=Math.hypot(a,b), f=m>1e-9?squareF(a/m,b/m,sq):1;
    return (1-m/f)*r; };
}

// Spun body (lathe with paddle/square applied), then cut if there is a cut.
// hole: optional {dist, at} for the jaw channel, skipped if the main cut took that glass away.
function buildBody(curve,hole){
  const prof=curve.getPoints(140), NP=prof.length, last=NP-1, M=112, up=new THREE.Vector3(0,1,0);
  const P=[], pos=[], uv=[], idx=[];
  for(let k=0;k<M;k++){ const phi=2*Math.PI*k/M;
    for(let i=0;i<NP;i++){ const r=Math.max(0.0001,prof[i].x), [x,z]=T(r*Math.cos(phi),r*Math.sin(phi));
      P.push(new THREE.Vector3(x,prof[i].y,z)); pos.push(x,prof[i].y,z); uv.push(k/M,i/last); } }
  for(let k=0;k<M;k++){ const k2=(k+1)%M; for(let i=0;i<last;i++){ const a=k*NP+i,b=k2*NP+i; idx.push(a,b,a+1,b,b+1,a+1); } }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  // a profile that ends away from the axis is already open at the top
  const top=[]; for(let k=0;k<M;k++) top.push(P[k*NP+last]);
  const natural=top.every(p=>Math.hypot(p.x,p.z)>0.06);
  const pl=cutPlane(P);
  let geo=g, rims=natural?[{pts:top,n:up}]:[];
  if(pl){
    const c=clipBy(g,p=>sideOf(pl,p)); g.dispose(); geo=c.geo;
    rims=c.loops.map(pts=>({pts,n:pl.n}));
    if(natural && top.every(p=>sideOf(pl,p)<=0)) rims.push({pts:top,n:up});
  }
  // the channel's edge is hidden inside the jaw, so it gets no lip
  if(hole && sideOf(pl,hole.at)<=0){ const c=clipBy(geo,hole.dist); geo.dispose(); geo=c.geo; }
  return {geo, plane:pl, rims};
}

// Jaw kickstand: once it's on, find the angle the piece tips to so the jaw and the body
// both touch the table, the way it will sit.
const restQ=new THREE.Quaternion(); let profTop=1;
function restAngle(bodyG,jawG,axis){
  const q=new THREE.Quaternion(), v=new THREE.Vector3();
  const low=(g,th,step)=>{ q.setFromAxisAngle(axis,th); const p=g.attributes.position; let m=Infinity;
    for(let i=0;i<p.count;i+=step){ v.fromBufferAttribute(p,i).applyQuaternion(q); if(v.y<m) m=v.y; } return m; };
  const f=th=>low(jawG,th,1)-low(bodyG,th,3);
  let a=-1.3, b=1.3, fa=f(a); if(fa*f(b)>0) return 0;
  for(let i=0;i<40;i++){ const m=(a+b)/2, fm=f(m); if(fa*fm<=0) b=m; else { a=m; fa=fm; } }
  return (a+b)/2;
}
function groundMat(){ const c=COLORS[S.color];
  return new THREE.MeshPhysicalMaterial({color:new THREE.Color(c.hex).lerp(new THREE.Color(0xffffff),.55),
    roughness:.65, metalness:0, transparent:true, opacity:Math.min(1,c.op+.35), side:THREE.DoubleSide}); }
// loop: closed ring of rim points; n: direction the mouth faces
function addLip(loop,n,glass){
  const L=S.open.lip;
  if(L==='fire'){ // flame-rounded edge: a soft bead the same glass as the body
    piece.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(loop,true,'centripetal'),Math.min(600,loop.length*2),WALL*.6,10,true),glass));
  } else if(L==='ground'){ // flat-ground and frosted: a U-shaped band whose top lies in the cut
    const pos=[], idx=[], N=loop.length, hw=WALL/2, dep=WALL*.7;
    const cen=loop.reduce((s,p)=>s.add(p),new THREE.Vector3()).multiplyScalar(1/N);
    for(const P of loop){
      const r=P.clone().sub(cen); r.addScaledVector(n,-r.dot(n)).normalize();
      [[-hw,-dep],[-hw,0],[hw,0],[hw,-dep]].forEach(([o,d])=>{ const v=P.clone().addScaledVector(r,o).addScaledVector(n,d); pos.push(v.x,v.y,v.z); });
    }
    for(let k=0;k<N;k++){ const k2=(k+1)%N; for(let j=0;j<3;j++){ const a=k*4+j,b=k2*4+j; idx.push(a,b,a+1,b,b+1,a+1); } }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
    piece.add(new THREE.Mesh(g,groundMat()));
  }
}

function rebuild(){
  piece.children.slice().forEach(m=>{piece.remove(m); m.geometry.dispose(); if(m.material.map) m.material.map.dispose(); m.material.dispose();});
  const mat=makeMat(), add=g=>piece.add(new THREE.Mesh(g,mat));
  restQ.identity();
  const B=S.bits, up=new THREE.Vector3(0,1,0), [r0,r1,open]=bitRadii();
  if(S.body==='bubble'){
    const curve=profileCurve(), J=S.jaw, jf=jawFrame(curve), jsq=J.square||0;
    const body=buildBody(curve, jf&&J.hollow ? {dist:channelDist(jf,J.size*.95,jsq), at:jf.base} : null), pl=body.plane; add(body.geo);
    profTop=Math.max(...S.profile.map(p=>p[1]));
    body.rims.forEach(r=>addLip(r.pts,r.n,mat));
    if(B.count>0){
      const list=[];
      if(B.mode==='ring'){ const t=tAtHeight(curve,B.at); for(let k=0;k<B.count;k++) list.push([t,2*Math.PI*k/B.count]); }
      else { for(let k=0;k<B.count;k++){ const h=B.count===1?B.from:B.from+(B.to-B.from)*k/(B.count-1);
        const t=tAtHeight(curve,h); list.push([t,0],[t,Math.PI]); } }
      for(const [t,phi] of list){
        const pt=curve.getPointAt(t), tan=curve.getTangentAt(t);
        const n2=new THREE.Vector2(tan.y,-tan.x).normalize();
        const [px,pz]=T(pt.x*Math.cos(phi),pt.x*Math.sin(phi));
        let h=new THREE.Vector3(px,0,pz); if(h.lengthSq()<1e-6) h.set(Math.cos(phi),0,Math.sin(phi)); h.normalize();
        const dir=h.multiplyScalar(n2.x).addScaledVector(up,n2.y).normalize();
        if(sideOf(pl,new THREE.Vector3(px,pt.y,pz))>0) continue; // bit was on glass that got cut off
        add(sweep(new THREE.Vector3(px,pt.y,pz),dir,B.len,r0,r1,B.curl,open));
      }
    }
    if(jf && sideOf(pl,jf.base)<=0){
      {
        // hollow: an open tube with a lip at its mouth; solid: a closed stub with a flat end
        const jg=sweep(jf.base,jf.dir,J.len,J.size,J.size*.8,0,!!J.hollow,.25,jsq); add(jg);
        if(J.hollow) addLip(jg.userData.endRing,jf.dir,mat);
        const axis=new THREE.Vector3().crossVectors(up,jf.hz).normalize();
        restQ.setFromAxisAngle(axis,restAngle(body.geo,jg,axis));
        const m4=new THREE.Matrix4().makeRotationFromQuaternion(restQ);
        piece.children.forEach(m=>m.geometry.applyMatrix4(m4));
      }
    }
  } else {
    const D=S.donut, g=new THREE.TorusGeometry(D.R,D.tube,40,128), p=g.attributes.position;
    for(let i=0;i<p.count;i++){ p.setY(i,p.getY(i)*D.tall); p.setZ(i,p.getZ(i)*D.flatten); }
    g.computeVertexNormals(); add(g);
    const Ro=D.R+D.tube;
    if(D.neckH>0){
      const n=new THREE.CylinderGeometry(D.neckW*0.72,D.neckW,D.neckH+D.tube*0.5,48,1,true), np=n.attributes.position;
      const zs=Math.min(1,D.flatten*1.6), y0=Ro*D.tall-D.tube*0.5+(D.neckH+D.tube*0.5)/2;
      for(let i=0;i<np.count;i++){ np.setZ(i,np.getZ(i)*zs); np.setY(i,np.getY(i)+y0); }
      n.computeVertexNormals(); add(n);
      const yTop=y0+(D.neckH+D.tube*0.5)/2, rT=D.neckW*0.72, loop=[];
      for(let k=0;k<64;k++){ const a=2*Math.PI*k/64; loop.push(new THREE.Vector3(rT*Math.cos(a),yTop,rT*Math.sin(a)*zs)); }
      addLip(loop,new THREE.Vector3(0,1,0),mat);
    }
    if(B.count>0){
      const gap=D.neckH>0?Math.min(0.9,D.neckW/Ro+0.25):0;
      for(let k=0;k<B.count;k++){
        let a;
        if(gap>0) a = B.count===1 ? -Math.PI/2 : Math.PI/2+gap+(2*Math.PI-2*gap)*k/(B.count-1);
        else a = Math.PI/2 + 2*Math.PI*k/B.count;
        const base=new THREE.Vector3(Math.cos(a)*Ro*0.97, Math.sin(a)*Ro*D.tall*0.97, 0);
        const dir=new THREE.Vector3(Math.cos(a)*D.tall, Math.sin(a), 0).normalize();
        add(sweep(base,dir,B.len,r0,r1,B.curl,open));
      }
    }
  }
  // center & fit
  const box=new THREE.Box3().setFromObject(piece), c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
  piece.position.sub(c);
  const box2=new THREE.Box3().setFromObject(piece);
  shadow.position.y=box2.min.y-0.005;
  const sw=Math.max(size.x,size.z)*1.5; shadow.scale.set(sw,sw,1);
  fitDist=Math.max(size.x,size.y,size.z)*2.5+0.5;
}
let pending=false;
function schedule(){ if(pending) return; pending=true; requestAnimationFrame(()=>{pending=false; const keep=piece.position.clone(); piece.position.set(0,0,0); rebuild(); save();}); }

/* orbit controls */
const ptrs=new Map(); let pinch0=0, dist0=0;
stage.addEventListener('pointerdown',e=>{ if(e.target.closest('.stage-tools')) return; stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); dist0=dist;} });
stage.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; const prev=ptrs.get(e.pointerId); const cur={x:e.clientX,y:e.clientY}; ptrs.set(e.pointerId,cur);
  if(ptrs.size===1){ yaw-=(cur.x-prev.x)*0.008; pitch=Math.max(-0.35,Math.min(1.35,pitch+(cur.y-prev.y)*0.006)); }
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0) dist=Math.max(1.5,Math.min(30,dist0*pinch0/d));} });
const endPtr=e=>{ptrs.delete(e.pointerId); if(ptrs.size<2) pinch0=0;};
stage.addEventListener('pointerup',endPtr); stage.addEventListener('pointercancel',endPtr);
stage.addEventListener('wheel',e=>{e.preventDefault(); dist=Math.max(1.5,Math.min(30,dist*(1+e.deltaY*0.001)));},{passive:false});

function renderColor(){

    slider('Color wraps',()=>S.wraps,v=>S.wraps=v,0,16,1,v=>v<1?'none':String(v), ()=>{schedule(); if((S.wraps>0)!==hadWraps) render();}));
  var hadWraps=S.wraps>0;
  if(S.wraps>0) content.append(h('span',{class:'seg-label',text:'Wrap color'}), swatches(()=>S.wrapColor,v=>S.wrapColor=v));
}

/* profile editor */
let peDraw=null;
function setupPE(cv){
  const ctx=cv.getContext('2d'); let drag=-1, lastTap={i:-1,t:0};
  const cs=getComputedStyle(document.documentElement);
  function map(){ const W=cv.clientWidth,H=cv.clientHeight; const s=Math.min((W-24)/2.9,(H-28)/2.75); return {W,H,s,cx:W/2,by:H-14}; }
  const toS=(m,r,y)=>[m.cx+r*m.s, m.by-y*m.s];
  function draw(){
    const dpr=Math.min(window.devicePixelRatio,2), m=map();
    if(cv.width!==Math.round(m.W*dpr)){cv.width=Math.round(m.W*dpr); cv.height=Math.round(m.H*dpr);}
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,m.W,m.H);
    if(sketch){ const ih=m.H*sk.scale, iw=ih*sketch.width/sketch.height;
      ctx.globalAlpha=sk.op; ctx.drawImage(sketch, m.cx-iw/2+sk.x*m.W, m.H/2-ih/2+sk.y*m.H, iw, ih); ctx.globalAlpha=1; }
    const ink=cs.getPropertyValue('--ink').trim(), muted=cs.getPropertyValue('--muted').trim(), acc=cs.getPropertyValue('--accent').trim();
    ctx.strokeStyle=muted; ctx.lineWidth=1; ctx.setLineDash([4,5]);
    ctx.beginPath(); ctx.moveTo(m.cx,6); ctx.lineTo(m.cx,m.H); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(10,m.by); ctx.lineTo(m.W-10,m.by); ctx.stroke();
    const pts=profileCurve().getPoints(120);
    ctx.lineWidth=2; ctx.strokeStyle=muted; ctx.globalAlpha=.6; ctx.beginPath();
    pts.forEach((p,i)=>{const [x,y]=toS(m,-p.x,p.y); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke(); ctx.globalAlpha=1;
    ctx.strokeStyle=acc; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=>{const [x,y]=toS(m,p.x,p.y); i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
    S.profile.forEach(([r,y],i)=>{const [x,yy]=toS(m,r,y); ctx.beginPath(); ctx.arc(x,yy,i===drag?9:7,0,Math.PI*2);
      ctx.fillStyle=i===drag?acc:cs.getPropertyValue('--panel').trim(); ctx.fill(); ctx.strokeStyle=acc; ctx.lineWidth=2; ctx.stroke();});
  }
  peDraw=draw;
  const pos=e=>{const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top];};
  cv.onpointerdown=e=>{
    const [x,y]=pos(e), m=map(); cv.setPointerCapture(e.pointerId);
    let best=-1,bd=22;
    S.profile.forEach(([r,yy],i)=>{const [sx,sy]=toS(m,r,yy); const d=Math.hypot(sx-x,sy-y); if(d<bd){bd=d;best=i;}});
    if(best>=0){
      const now=performance.now();
      if(lastTap.i===best && now-lastTap.t<320 && S.profile.length>3){ S.profile.splice(best,1); lastTap={i:-1,t:0}; schedule(); draw(); return; }
      lastTap={i:best,t:now}; drag=best; draw(); return;
    }
    // insert on nearest segment
    let seg=-1, sd=18;
    for(let i=0;i<S.profile.length-1;i++){
      const [ax,ay]=toS(m,...S.profile[i]), [bx,by]=toS(m,...S.profile[i+1]);
      const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy||1, t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/L));
      const d=Math.hypot(ax+dx*t-x, ay+dy*t-y); if(d<sd){sd=d;seg=i;}
    }
    if(seg>=0){ S.profile.splice(seg+1,0,[Math.max(0,(x-m.cx)/m.s),(m.by-y)/m.s]); drag=seg+1; schedule(); draw(); }
  };
  cv.onpointermove=e=>{ if(drag<0) return; const [x,y]=pos(e), m=map();
    S.profile[drag]=[Math.max(0,Math.min(1.45,(x-m.cx)/m.s)), Math.max(0,Math.min(2.7,(m.by-y)/m.s))]; schedule(); draw(); };
  cv.onpointerup=cv.onpointercancel=()=>{ drag=-1; draw(); };
  new ResizeObserver(draw).observe(cv);
}

/* ---------- orthographic drawing ---------- */
const CELL=640, INK='#1d2830', FAINT='#8a969e';
let dRen=null, sheet=null;
function offRenderer(){
  if(!dRen){ dRen=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
    dRen.outputEncoding=THREE.sRGBEncoding; dRen.setPixelRatio(1); dRen.setSize(CELL,CELL,false); }
  return dRen;
}
// One shared scale (k px per unit) for every view, so the sheet measures true.
function orthoViews(){
  const box=new THREE.Box3().setFromObject(piece), size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  const k=CELL/(Math.max(size.x,size.y,size.z)*1.4), half=CELL/(2*k), Y=new THREE.Vector3(0,1,0);
  const cam=(off,up)=>{ const c=new THREE.OrthographicCamera(-half,half,half,-half,0.01,100);
    c.position.copy(ctr).add(off); c.up.copy(up); c.lookAt(ctr); c.updateMatrixWorld();
    c.matrixWorldInverse.copy(c.matrixWorld).invert(); return c; };
  return {k,size,views:[
    {name:'Front',cam:cam(new THREE.Vector3(0,0,20),Y),w:size.x,h:size.y},
    {name:'Side', cam:cam(new THREE.Vector3(20,0,0),Y),w:size.z,h:size.y},
    {name:'Top',  cam:cam(new THREE.Vector3(0,20,0),new THREE.Vector3(0,0,-1)),w:size.x,h:size.z}]};
}
// Outline style: render flat part IDs and surface normals, then ink every pixel where
// the part changes (silhouettes, bits against the body, lips) or the surface folds sharply
// (the inside wall showing through an opening).
function outlineCell(cam){
  const r=offRenderer(), rt=new THREE.WebGLRenderTarget(CELL,CELL), meshes=piece.children, orig=meshes.map(m=>m.material);
  const read=()=>{ const b=new Uint8Array(CELL*CELL*4); r.setRenderTarget(rt); r.setClearColor(0x000000,0); r.clear();
    r.render(scene,cam); r.readRenderTargetPixels(rt,0,0,CELL,CELL,b); r.setRenderTarget(null); return b; };
  const idMats=meshes.map((m,i)=>new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(((i+1)*7%256)/255,((i+1)*13%256)/255,.5),side:THREE.DoubleSide}));
  meshes.forEach((m,i)=>m.material=idMats[i]); const ids=read();
  const nm=new THREE.MeshNormalMaterial({side:THREE.DoubleSide});
  meshes.forEach(m=>m.material=nm); const nrm=read();
  meshes.forEach((m,i)=>m.material=orig[i]); idMats.forEach(m=>m.dispose()); nm.dispose(); rt.dispose();

  const img=new ImageData(CELL,CELL), o=img.data, tint=new THREE.Color(COLORS[S.color].hex);
  const tr=Math.round(tint.r*255), tg=Math.round(tint.g*255), tb=Math.round(tint.b*255);
  const px=(x,y)=>((CELL-1-y)*CELL+x)*4; // GL rows run bottom-up
  const dot=(i,j)=>{ let s=0; for(let c=0;c<3;c++) s+=(nrm[i+c]/127.5-1)*(nrm[j+c]/127.5-1); return s; };
  const ink=(x,y)=>{ for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){ if(x+dx>=CELL||y+dy>=CELL) continue;
    const q=((y+dy)*CELL+x+dx)*4; o[q]=29;o[q+1]=40;o[q+2]=48;o[q+3]=255; } };
  for(let y=0;y<CELL-1;y++) for(let x=0;x<CELL-1;x++){
    const i=px(x,y), obj=ids[i+3]>0; let edge=false;
    for(const j of [px(x+1,y),px(x,y+1)]){
      const objJ=ids[j+3]>0;
      if(obj!==objJ || (obj && (ids[j]!==ids[i]||ids[j+1]!==ids[i+1])) || (obj && dot(i,j)<0.55)){ edge=true; break; }
    }
    if(edge) ink(x,y);
    else if(obj){ const q=(y*CELL+x)*4; if(!o[q+3]){ o[q]=tr;o[q+1]=tg;o[q+2]=tb;o[q+3]=34; } }
  }
  const c=document.createElement('canvas'); c.width=c.height=CELL; c.getContext('2d').putImageData(img,0,0); return c;
}
function shadedCell(cam){
  const r=offRenderer(); r.setRenderTarget(null); r.setClearColor(0x000000,0); r.clear(); r.render(scene,cam); return r.domElement;
}

/* drafting marks */
function centerLine(g,x1,y1,x2,y2){ g.save(); g.strokeStyle=FAINT; g.lineWidth=1.5; g.setLineDash([22,6,4,6]);
  g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.restore(); }
function dimLine(g,ax,ay,bx,by,label,vertical){
  g.save(); g.strokeStyle=INK; g.fillStyle=INK; g.lineWidth=1.5;
  g.beginPath(); g.moveTo(ax,ay); g.lineTo(bx,by); g.stroke();
  const tick=(x,y)=>{ g.beginPath(); g.moveTo(x-8,y+8); g.lineTo(x+8,y-8); g.stroke(); }; // architectural slash
  tick(ax,ay); tick(bx,by);
  g.font='600 22px "Bricolage Grotesque",system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  const mx=(ax+bx)/2, my=(ay+by)/2, w=g.measureText(label).width+14;
  g.translate(mx,my); if(vertical) g.rotate(-Math.PI/2);
  g.fillStyle='#ffffff'; g.fillRect(-w/2,-14,w,28); g.fillStyle=INK; g.fillText(label,0,1);
  g.restore();
}
function extLine(g,x1,y1,x2,y2){ g.save(); g.strokeStyle=FAINT; g.lineWidth=1; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); g.restore(); }

async function makeSheet(){
  try{ await document.fonts.ready; }catch(e){}
  const D=S.draw, {k,size,views}=orthoViews();
  const per = D.height>0 ? D.height/size.y : 0;   // real units per model unit
  const fmt=v=> per ? (v*per).toFixed(1)+' '+D.unit : '';
  const rows = D.style==='both' ? ['shaded','outline'] : [D.style];
  const M=60, G=40, HEAD=120, ROWH=CELL+60;
  const W=M*2+CELL*3+G*2, H=HEAD+rows.length*ROWH+40;
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle=INK; g.textBaseline='alphabetic';
  g.font='750 40px "Bricolage Grotesque",system-ui,sans-serif'; g.fillText('Glass Sketchbook',M,M+12);
  g.font='400 22px "Bricolage Grotesque",system-ui,sans-serif'; g.fillStyle=FAINT;
  const desc=[S.body==='bubble'?'Blown bubble':'Blown donut', COLORS[S.color].n+' glass', per?'height '+fmt(size.y):'unscaled'];
  g.fillText('Orthographic views · '+desc.join(' · '),M,M+48);
  g.textAlign='right'; g.fillText(new Date().toLocaleDateString(),W-M,M+12); g.textAlign='left';

  const axisW = S.body==='bubble' ? [0,profTop].map(y=>new THREE.Vector3(0,y,0).applyQuaternion(restQ).add(piece.position)) : null;
  const shadowWas=shadow.visible; shadow.visible=false;
  rows.forEach((style,ri)=>views.forEach((v,vi)=>{
    const x0=M+vi*(CELL+G), y0=HEAD+ri*ROWH, cx=x0+CELL/2, cy=y0+CELL/2;
    if(style==='shaded'){
      const gr=g.createRadialGradient(cx,y0+CELL*.35,20,cx,cy,CELL*.75); gr.addColorStop(0,'#f4f7f8'); gr.addColorStop(1,'#d3dbe0');
      g.fillStyle=gr; g.fillRect(x0,y0,CELL,CELL); g.drawImage(shadedCell(v.cam),x0,y0,CELL,CELL);
    } else g.drawImage(outlineCell(v.cam),x0,y0);
    g.strokeStyle='#cbd3d8'; g.lineWidth=1; g.strokeRect(x0+.5,y0+.5,CELL-1,CELL-1);
    const hw=v.w*k/2, hh=v.h*k/2, L=cx-hw, R=cx+hw, T=cy-hh, B=cy+hh;
    // centerlines: the piece's spin axis, drawn where it really is (tipped, if it sits on a jaw);
    // seen end-on it becomes a crosshair
    if(axisW){
      const [A,Bp]=axisW.map(p=>{ const q=p.clone().project(v.cam); return [x0+(q.x+1)/2*CELL, y0+(1-q.y)/2*CELL]; });
      const dx=Bp[0]-A[0], dy=Bp[1]-A[1], len=Math.hypot(dx,dy);
      if(len<3){ centerLine(g,A[0],T-24,A[0],B+24); centerLine(g,L-24,A[1],R+24,A[1]); }
      else { const ux=dx/len, uy=dy/len; centerLine(g,A[0]-ux*24,A[1]-uy*24,Bp[0]+ux*30,Bp[1]+uy*30); }
    } else if(v.name==='Top'){ centerLine(g,cx,T-24,cx,B+24); centerLine(g,L-24,cy,R+24,cy); }
    else centerLine(g,cx,T-30,cx,B+24);
    if(per){
      if(v.name!=='Top'){ const dy=B+40; extLine(g,L,B+6,L,dy+10); extLine(g,R,B+6,R,dy+10); dimLine(g,L,dy,R,dy,fmt(v.w),false); }
      if(v.name==='Front'){ const dx=L-40; extLine(g,L-6,T,dx-10,T); extLine(g,L-6,B,dx-10,B); dimLine(g,dx,T,dx,B,fmt(v.h),true); }
    }
    g.fillStyle=INK; g.font='600 24px "Bricolage Grotesque",system-ui,sans-serif';
    g.fillText(v.name+(rows.length>1?(style==='shaded'?' · shaded':' · outline'):''),x0,y0+CELL+34);
  }));
  shadow.visible=shadowWas;
  if(per){ // scale bar: one real unit (or 5, if one is tiny)
    const unitPx=k/per, n=unitPx<30?5:1, len=unitPx*n, x=W-M-len, y=H-30;
    g.strokeStyle=INK; g.lineWidth=3; g.beginPath(); g.moveTo(x,y); g.lineTo(x+len,y); g.stroke();
    g.lineWidth=1.5; [x,x+len].forEach(t=>{g.beginPath(); g.moveTo(t,y-8); g.lineTo(t,y+8); g.stroke();});
    g.fillStyle=INK; g.font='400 20px "Bricolage Grotesque",system-ui,sans-serif'; g.textAlign='right'; g.fillText(n+' '+D.unit,x-12,y+7); g.textAlign='left';
  }
  return c;
}

const drawDlg=document.getElementById('drawDlg'), drawPrev=document.getElementById('drawPrev');
let prevT;
function refreshDrawing(){ clearTimeout(prevT); prevT=setTimeout(async()=>{ sheet=await makeSheet(); drawPrev.src=sheet.toDataURL('image/png'); },60); }
function renderDrawOpts(){
  const D=S.draw, box=document.getElementById('drawOpts'); box.innerHTML='';
  const after=()=>{ save(); renderDrawOpts(); refreshDrawing(); };
  const style=seg('Style',[['shaded','Shaded'],['outline','Outline'],['both','Both']],()=>D.style,v=>D.style=v,after); style.classList.add('wide');
  const units=seg('Units',[['cm','cm'],['in','in']],()=>D.unit,v=>D.unit=v,after);
  const inp=h('input',{type:'number',id:'drawH',min:'0',step:'0.5',value:D.height||'',inputmode:'decimal'});
  inp.oninput=()=>{ D.height=Math.max(0,+inp.value||0); save(); refreshDrawing(); };
  box.append(style, units, h('div',{class:'row num'}, h('label',{class:'seg-label',for:'drawH',text:'Real height of the piece (blank for no measurements)'}), inp));
}
document.getElementById('drawBtn').onclick=()=>{ renderDrawOpts(); drawPrev.removeAttribute('src'); drawDlg.showModal(); refreshDrawing(); };
document.getElementById('drawSave').onclick=()=>{ if(!sheet) return;
  sheet.toBlob(b=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='glass-sketchbook-'+S.body+'-orthographic.png'; document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000); },'image/png'); };

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.tab; document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b))); peDraw=null; render(); });
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ const keepDraw=S.draw; S=fromPreset(b.dataset.preset); S.draw=keepDraw; piece.position.set(0,0,0); rebuild(); save(); dist=fitDist; render(); });

resize(); rebuild(); dist=fitDist; render(); loop();
</script>
